<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ngecrot.fun</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <button type="button" class="mark" id="homeLink">ngecrot.fun</button>
      <p class="bio">Teman streaming terbaikmu.</p>
    </div>
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="search" id="searchInput" placeholder="Cari judul, kategori, pemeran…" aria-label="Cari video">
    </div>
  </header>

  <!-- ======= HALAMAN BERANDA ======= -->
  <div id="homeView">

    <nav class="category-nav" id="categoryNav" aria-label="Jelajah kategori">
      <!-- diisi otomatis dari data.json -->
    </nav>

    <div class="filter-bar" id="filterBar" hidden>
      <span class="filter-label" id="filterLabel">Kategori:</span>
      <span class="filter-value" id="filterValue"></span>
      <button class="filter-clear" id="filterClear">Hapus filter &times;</button>
    </div>

    <main class="grid" id="grid">
      <!-- diisi otomatis dari data.json -->
    </main>

    <nav class="pagination" id="pagination" aria-label="Navigasi halaman">
      <!-- diisi otomatis -->
    </nav>

  </div>

  <!-- ======= HALAMAN TONTON ======= -->
  <div id="watchView" hidden>

    <button type="button" class="back-btn" id="backBtn">← Kembali</button>

    <div class="watch-body">
      <div class="player-frame" id="playerFrame"></div>

      <div class="player-info">
        <h1 id="playerTitle">—</h1>
        <p class="player-desc" id="playerDesc"></p>

        <div class="player-meta-row">
          <div class="player-cast-wrap" id="playerCastWrap">
            <span class="cast-label">Pemeran:</span>
            <div class="player-cast" id="playerCast"></div>
          </div>
          <div class="player-tags" id="playerTags"></div>
        </div>

        <div class="download-wrap">
          <span class="download-title">Unduh Video</span>
          <div class="download-cmd-box">
            <code class="download-cmd" id="downloadCmd"></code>
            <button type="button" class="copy-icon-btn" id="downloadBtn" aria-label="Salin perintah" title="Salin perintah">⧉</button>
          </div>
        </div>

        <div class="player-recs" id="playerRecs">
          <span class="recs-title">Rekomendasi</span>
          <div class="recs-row" id="recsRow"></div>
        </div>
      </div>
    </div>

  </div>

  <footer class="site-footer">
    Dibuat dengan ☕ dan ❤️
  </footer>

  <script src="script.js"></script>
</body>
</html>
