<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ngecrot-terus.fun</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="mark">Reel<span>Now</span></div>
    <div class="tagline">Screening</div>
  </header>

  <main>
    <section id="grid" class="grid" aria-label="Daftar video"></section>
  </main>

  <div id="overlay" class="player-overlay" hidden>
    <div class="player-panel" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
      <button id="closeBtn" class="close-btn" type="button" aria-label="Tutup player">
        &times;
      </button>

      <div id="playerFrame" class="player-frame"></div>

      <div class="player-info">
        <div>
          <h1 id="playerTitle"></h1>
          <p id="playerDesc" class="player-desc"></p>
        </div>
        <span id="playerCat" class="player-cat"></span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
