<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVault</title>
<style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #141414;
  --bg-tertiary: #1e1e1e;
  --bg-hover: #2a2a2a;
  --border: #2e2e2e;
  --text-primary: #f1f1f1;
  --text-secondary: #aaaaaa;
  --text-muted: #717171;
  --accent: #e50914;
  --chip-bg: #252525;
  --chip-hover: #353535;
  --chip-active-bg: #f1f1f1;
  --chip-active-text: #0a0a0a;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --transition: 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
body { background:var(--bg-primary); color:var(--text-primary); min-height:100vh; -webkit-font-smoothing:antialiased; }
button { font-family:inherit; border:none; background:none; cursor:pointer; }
img { display:block; }

/* ============================================
   HEADER — Selalu visible, logo kiri + search tengah
   ============================================ */
.header {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:60px; padding:0 24px;
  display:flex; align-items:center; gap:20px;
  background:rgba(10,10,10,0.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.logo {
  font-size:1.1rem; font-weight:800; color:var(--accent);
  letter-spacing:-0.5px; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.search-wrap {
  flex:1; max-width:520px; position:relative;
  /* Center the search bar horizontally */
  margin:0 auto;
}
.search-input {
  width:100%; height:38px; padding:0 38px 0 38px;
  background:var(--bg-tertiary); border:1px solid var(--border);
  border-radius:20px; color:var(--text-primary); font-size:0.875rem;
  outline:none; transition:all var(--transition);
}
.search-input:focus { border-color:#555; background:var(--bg-hover); box-shadow:0 0 0 3px rgba(229,9,20,0.08); }
.search-input::placeholder { color:var(--text-muted); }
.search-icon {
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:16px; height:16px; color:var(--text-muted); pointer-events:none;
}
.search-clear {
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%;
  color:var(--text-muted); display:none; align-items:center; justify-content:center;
  font-size:1rem; transition:all var(--transition);
}
.search-clear:hover { background:var(--bg-hover); color:var(--text-primary); }
.search-clear.visible { display:flex; }

/* Spacer untuk fixed header */
.header-spacer { height:60px; }

/* ============================================
   HERO — Hanya muncul di awal (centered fullscreen)
   ============================================ */
.hero-overlay {
  position:fixed; inset:0; z-index:150;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:var(--bg-primary);
  padding:0 24px;
  transition:opacity 0.35s ease, visibility 0.35s ease;
}
.hero-overlay.hidden {
  opacity:0; visibility:hidden; pointer-events:none;
}
.hero-title {
  font-size:clamp(1.4rem, 5vw, 2.4rem);
  font-weight:800; margin-bottom:28px;
  text-align:center; letter-spacing:-1px;
  line-height:1.2; white-space:nowrap;
}
.hero-search-wrap {
  width:100%; max-width:580px; position:relative;
}
.hero-search-input {
  width:100%; height:52px; padding:0 44px 0 48px;
  background:var(--bg-tertiary); border:1px solid var(--border);
  border-radius:26px; color:var(--text-primary); font-size:1rem;
  outline:none; transition:all var(--transition);
}
.hero-search-input:focus { border-color:#555; background:var(--bg-hover); box-shadow:0 0 0 3px rgba(229,9,20,0.1); }
.hero-search-input::placeholder { color:var(--text-muted); }
.hero-search-icon {
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--text-muted); pointer-events:none;
}
.hero-search-clear {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%;
  color:var(--text-muted); display:none; align-items:center; justify-content:center;
  font-size:1.1rem; transition:all var(--transition);
}
.hero-search-clear:hover { background:var(--bg-hover); color:var(--text-primary); }
.hero-search-clear.visible { display:flex; }

/* Popular tags di hero */
.popular-tags {
  margin-top:24px; display:flex; flex-wrap:wrap; gap:8px;
  justify-content:center; max-width:580px;
}
.tag-label {
  font-size:0.7rem; color:var(--text-muted); width:100%;
  text-align:center; margin-bottom:4px;
  text-transform:uppercase; letter-spacing:0.5px;
}
.chip {
  display:inline-block; padding:6px 14px; border-radius:20px;
  background:var(--chip-bg); color:var(--text-secondary);
  font-size:0.78rem; font-weight:500; border:1px solid transparent;
  cursor:pointer; transition:all var(--transition); white-space:nowrap;
}
.chip:hover { background:var(--chip-hover); color:var(--text-primary); border-color:var(--border); }

/* ============================================
   FILTER BAR
   ============================================ */
.filter-bar {
  padding:12px 24px 0; max-width:1400px; margin:0 auto;
  display:none; align-items:center; gap:8px; flex-wrap:wrap;
}
.filter-bar.active { display:flex; }
.filter-label { font-size:0.75rem; color:var(--text-muted); white-space:nowrap; }
.filter-chip-active {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px 4px 12px; border-radius:20px;
  background:var(--chip-active-bg); color:var(--chip-active-text);
  font-size:0.75rem; font-weight:600; cursor:pointer;
  transition:opacity var(--transition);
}
.filter-chip-active:hover { opacity:0.85; }
.filter-chip-active svg { width:12px; height:12px; }

/* ============================================
   RESULTS GRID
   ============================================ */
.results-section {
  display:none; padding:16px 24px 40px; max-width:1400px; margin:0 auto;
}
.results-section.active { display:block; }
.results-count { font-size:0.75rem; color:var(--text-muted); margin-bottom:14px; }
.grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px;
}
.card { cursor:pointer; border-radius:var(--radius-md); overflow:hidden; transition:transform var(--transition), box-shadow var(--transition); }
.card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.4); }
.card-thumb { width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--bg-tertiary); }
.card-body { padding:10px 2px; }
.card-title {
  font-size:0.9rem; font-weight:600; line-height:1.35; margin-bottom:6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

/* ============================================
   WATCH VIEW
   ============================================ */
.watch-view { display:none; padding:16px 24px 40px; max-width:1400px; margin:0 auto; gap:24px; }
.watch-view.active { display:grid; grid-template-columns:1fr 380px; }
.primary { min-width:0; }
.player-box { width:100%; aspect-ratio:16/9; background:#000; border-radius:var(--radius-lg); overflow:hidden; margin-bottom:16px; }
.player-box iframe,.player-box video { width:100%; height:100%; border:none; }
.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; margin-bottom:14px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text-secondary); font-size:0.8rem; font-weight:500;
  cursor:pointer; transition:all var(--transition);
}
.back-btn:hover { background:var(--bg-tertiary); color:var(--text-primary); border-color:#555; }
.back-btn svg { width:14px; height:14px; }
.watch-title { font-size:1.25rem; font-weight:700; line-height:1.3; margin-bottom:10px; }
.watch-detail-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
.detail-label { font-size:0.75rem; color:var(--text-muted); white-space:nowrap; margin-right:2px; }

/* Sidebar */
.sidebar { display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 100px); overflow-y:auto; padding-right:4px; }
.sidebar::-webkit-scrollbar { width:3px; }
.sidebar::-webkit-scrollbar-track { background:transparent; }
.sidebar::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
.rec-card { display:flex; gap:10px; cursor:pointer; padding:8px; border-radius:var(--radius-md); transition:background var(--transition); }
.rec-card:hover { background:var(--bg-tertiary); }
.rec-thumb { width:160px; min-width:160px; aspect-ratio:16/9; border-radius:var(--radius-sm); object-fit:cover; background:var(--bg-tertiary); }
.rec-info { display:flex; flex-direction:column; justify-content:center; min-width:0; }
.rec-title { font-size:0.82rem; font-weight:600; line-height:1.3; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rec-sub { font-size:0.7rem; color:var(--text-muted); }

/* State */
.state-msg { text-align:center; padding:60px 20px; color:var(--text-muted); font-size:0.9rem; }

/* ============================================
   RESPONSIVE
   ============================================ */
@media(max-width:900px) {
  .watch-view.active { grid-template-columns:1fr; }
  .sidebar { max-height:none; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; margin-top:8px; }
  .rec-card { flex-direction:column; }
  .rec-thumb { width:100%; min-width:unset; }
}
@media(max-width:600px) {
  .header { padding:0 14px; gap:12px; }
  .logo { font-size:0.95rem; }
  .search-input { height:34px; font-size:0.8rem; padding:0 32px 0 34px; }
  .hero-overlay { padding:0 16px; }
  .hero-title { margin-bottom:20px; }
  .hero-search-input { height:46px; font-size:0.9rem; }
  .results-section,.watch-view { padding-left:14px; padding-right:14px; }
  .filter-bar { padding-left:14px; padding-right:14px; }
  .grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .card-title { font-size:0.78rem; }
}
</style>
</head>
<body>

<!-- ====== FIXED HEADER (selalu ada) ====== -->
<header class="header" id="mainHeader">
  <div class="logo" onclick="resetToHero()">STREAMVAULT</div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="headerSearch" placeholder="Cari judul, studio, pemeran...">
    <button class="search-clear" id="headerSearchClear" onclick="clearHeaderSearch()">&times;</button>
  </div>
</header>
<div class="header-spacer"></div>

<!-- ====== HERO OVERLAY (hanya awal) ====== -->
<div class="hero-overlay" id="heroOverlay">
  <h1 class="hero-title">Apa yang ingin kamu tonton?</h1>
  <div class="hero-search-wrap">
    <svg class="hero-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="hero-search-input" id="heroSearch" placeholder="Cari judul, studio, pemeran...">
    <button class="hero-search-clear" id="heroSearchClear" onclick="clearHeroSearch()">&times;</button>
  </div>
  <div class="popular-tags" id="popularTags">
    <div class="tag-label">Populer</div>
  </div>
</div>

<!-- ====== FILTER BAR ====== -->
<div class="filter-bar" id="filterBar">
  <span class="filter-label">Filter aktif:</span>
  <button class="filter-chip-active" onclick="clearFilter()">
    <span id="filterChipText"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<!-- ====== RESULTS ====== -->
<section class="results-section" id="resultsSection">
  <div class="results-count" id="resultsCount"></div>
  <div id="grid" class="grid"></div>
</section>

<!-- ====== WATCH PAGE ====== -->
<div id="watchView" class="watch-view">
  <div class="primary">
    <button class="back-btn" onclick="goBackFromWatch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Kembali
    </button>
    <div class="player-box" id="playerBox"></div>
    <h1 class="watch-title" id="wTitle"></h1>
    <div id="wMeta"></div>
  </div>
  <div class="sidebar" id="recList"></div>
</div>

<script>
let allVideos = [];
let activeFilter = null;
let heroDismissed = false;

// Elements
const heroOverlay    = document.getElementById('heroOverlay');
const heroSearch     = document.getElementById('heroSearch');
const heroSearchClear= document.getElementById('heroSearchClear');
const headerSearch   = document.getElementById('headerSearch');
const headerSearchClear = document.getElementById('headerSearchClear');
const popularTags    = document.getElementById('popularTags');
const filterBar      = document.getElementById('filterBar');
const filterChipText = document.getElementById('filterChipText');
const resultsSection = document.getElementById('resultsSection');
const resultsCount   = document.getElementById('resultsCount');
const grid           = document.getElementById('grid');
const playerBox      = document.getElementById('playerBox');
const recList        = document.getElementById('recList');
const watchView      = document.getElementById('watchView');

// --- UTILS ---
function isEmbed(url) {
  return /iframe|embed|vk\.ru\/video_ext|youtube\.com\/embed|dailymotion\.com\/embed/i.test(url);
}
function escHtml(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

// --- DISMISS HERO ---
function dismissHero(query) {
  if (!heroDismissed) {
    heroDismissed = true;
    heroOverlay.classList.add('hidden');
  }
  // Sync query ke header search
  if (query !== undefined) {
    headerSearch.value = query;
    headerSearchClear.classList.toggle('visible', query.length > 0);
  }
}

function resetToHero() {
  // Stop player
  playerBox.innerHTML = '';
  watchView.classList.remove('active');
  resultsSection.classList.remove('active');
  filterBar.classList.remove('active');
  activeFilter = null;
  headerSearch.value = '';
  headerSearchClear.classList.remove('visible');
  heroSearch.value = '';
  heroSearchClear.classList.remove('visible');
  heroDismissed = false;
  heroOverlay.classList.remove('hidden');
}

// --- POPULAR TAGS (max 6) ---
function buildPopularTags() {
  const tagMap = {};
  allVideos.forEach(v => {
    if (v.studio) tagMap['studio:'+v.studio] = (tagMap['studio:'+v.studio]||0)+1;
    (v.kategori||[]).forEach(k => { tagMap['kategori:'+k] = (tagMap['kategori:'+k]||0)+1; });
  });
  const sorted = Object.entries(tagMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if (!sorted.length) { popularTags.style.display='none'; return; }
  let html = '<div class="tag-label">Populer</div>';
  sorted.forEach(([key]) => {
    const [type, val] = key.split(':');
    html += `<span class="chip" onclick="applyFilter('${escHtml(type)}','${escHtml(val)}')">${escHtml(val)}</span>`;
  });
  popularTags.innerHTML = html;
}

// --- HERO SEARCH ---
heroSearch.addEventListener('input', () => {
  heroSearchClear.classList.toggle('visible', heroSearch.value.length > 0);
});
function clearHeroSearch() {
  heroSearch.value = '';
  heroSearchClear.classList.remove('visible');
  heroSearch.focus();
}
// Saat user ketik di hero search → dismiss hero, pindah ke header search + show results
heroSearch.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && heroSearch.value.trim()) {
    dismissHero(heroSearch.value.trim());
    renderResults();
  }
});
// Atau langsung dismiss saat mulai ketik
heroSearch.addEventListener('input', () => {
  heroSearchClear.classList.toggle('visible', heroSearch.value.length > 0);
  if (heroSearch.value.trim().length > 0) {
    dismissHero(heroSearch.value.trim());
    renderResults();
  }
});

// --- HEADER SEARCH ---
headerSearch.addEventListener('input', () => {
  headerSearchClear.classList.toggle('visible', headerSearch.value.length > 0);
  if (!heroDismissed) dismissHero(headerSearch.value);
  activeFilter = null;
  renderFilterBar();
  renderResults();
});
function clearHeaderSearch() {
  headerSearch.value = '';
  headerSearchClear.classList.remove('visible');
  activeFilter = null;
  renderFilterBar();
  renderResults();
  headerSearch.focus();
}

// --- FILTER ---
function applyFilter(type, value) {
  activeFilter = { type, value };
  headerSearch.value = '';
  headerSearchClear.classList.remove('visible');
  dismissHero();
  renderFilterBar();
  renderResults();
  // Jika sedang di watch page, kembali ke results
  if (watchView.classList.contains('active')) {
    playerBox.innerHTML = '';
    watchView.classList.remove('active');
  }
}
function clearFilter() {
  activeFilter = null;
  renderFilterBar();
  renderResults();
}
function renderFilterBar() {
  if (!activeFilter) { filterBar.classList.remove('active'); return; }
  const labels = { studio:'Studio', kategori:'Kategori', pemeran:'Pemeran' };
  filterChipText.textContent = `${labels[activeFilter.type]}: ${activeFilter.value}`;
  filterBar.classList.add('active');
}

// --- RESULTS ---
function getFilteredVideos() {
  const q = headerSearch.value.trim().toLowerCase();
  if (activeFilter) {
    return allVideos.filter(v => {
      if (activeFilter.type==='studio') return (v.studio||'').toLowerCase()===activeFilter.value.toLowerCase();
      if (activeFilter.type==='pemeran') return (v.pemeran||[]).some(p=>p.toLowerCase()===activeFilter.value.toLowerCase());
      if (activeFilter.type==='kategori') return (v.kategori||[]).some(k=>k.toLowerCase()===activeFilter.value.toLowerCase());
      return false;
    });
  }
  if (!q) return [];
  return allVideos.filter(v => {
    const h=[v.title,v.studio,...(v.kategori||[]),...(v.pemeran||[])].filter(Boolean).join(' ').toLowerCase();
    return h.includes(q);
  });
}

function renderResults() {
  const filtered = getFilteredVideos();
  const q = headerSearch.value.trim();
  const hasQuery = q.length > 0 || activeFilter;

  if (!hasQuery) {
    resultsSection.classList.remove('active');
    return;
  }
  resultsSection.classList.add('active');

  if (filtered.length === 0) {
    const msg = activeFilter
      ? `Tidak ada video untuk ${activeFilter.type}: "${activeFilter.value}"`
      : `Tidak ditemukan hasil untuk "${escHtml(q)}"`;
    resultsCount.textContent = '';
    grid.innerHTML = `<div class="state-msg">${msg}</div>`;
    return;
  }

  resultsCount.textContent = `${filtered.length} video ditemukan`;
  grid.innerHTML = filtered.map(v => {
    const idx = allVideos.indexOf(v);
    const cats = (v.kategori||[]).map(k =>
      `<span class="chip" onclick="event.stopPropagation();applyFilter('kategori','${escHtml(k)}')">${escHtml(k)}</span>`
    ).join('');
    const studio = v.studio
      ? `<span class="chip" onclick="event.stopPropagation();applyFilter('studio','${escHtml(v.studio)}')">${escHtml(v.studio)}</span>` : '';
    return `<div class="card" onclick="openWatch(${idx})">
      <img class="card-thumb" src="${escHtml(v.cover)}" alt="${escHtml(v.title)}" loading="lazy" onerror="this.src='https://via.placeholder.com/640x360/1e1e1e/555?text=No+Cover'">
      <div class="card-body">
        <div class="card-title">${escHtml(v.title)}</div>
        <div class="card-meta">${studio}${cats}</div>
      </div>
    </div>`;
  }).join('');
}

// --- WATCH ---
function openWatch(idx) {
  const v = allVideos[idx];
  if (!v) return;

  dismissHero();
  resultsSection.classList.remove('active');
  filterBar.classList.remove('active');

  playerBox.innerHTML = isEmbed(v.url)
    ? `<iframe src="${escHtml(v.url)}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>`
    : `<video src="${escHtml(v.url)}" controls autoplay playsinline></video>`;
  document.getElementById('wTitle').textContent = v.title;

  let meta = '';
  if (v.studio) meta += `<div class="watch-detail-row"><span class="detail-label">Studio</span><span class="chip" onclick="applyFilter('studio','${escHtml(v.studio)}')">${escHtml(v.studio)}</span></div>`;
  if (v.pemeran?.length) meta += `<div class="watch-detail-row"><span class="detail-label">Pemeran</span>${v.pemeran.map(p=>`<span class="chip" onclick="applyFilter('pemeran','${escHtml(p)}')">${escHtml(p)}</span>`).join('')}</div>`;
  if (v.kategori?.length) meta += `<div class="watch-detail-row"><span class="detail-label">Kategori</span>${v.kategori.map(k=>`<span class="chip" onclick="applyFilter('kategori','${escHtml(k)}')">${escHtml(k)}</span>`).join('')}</div>`;
  document.getElementById('wMeta').innerHTML = meta;

  const recs = allVideos.filter((_,i)=>i!==idx);
  recList.innerHTML = recs.length
    ? recs.map(r=>{const ri=allVideos.indexOf(r);return `<div class="rec-card" onclick="openWatch(${ri})"><img class="rec-thumb" src="${escHtml(r.cover)}" alt="${escHtml(r.title)}" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/1e1e1e/555?text=No+Cover'"><div class="rec-info"><div class="rec-title">${escHtml(r.title)}</div><div class="rec-sub">${escHtml(r.studio||'')}${r.kategori?.[0]?' · '+escHtml(r.kategori[0]):''}</div></div></div>`;}).join('')
    : '<div style="color:var(--text-muted);padding:20px;text-align:center;font-size:0.82rem;">Tidak ada video lain</div>';

  watchView.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function goBackFromWatch() {
  playerBox.innerHTML = '';
  watchView.classList.remove('active');
  // Kembali ke results jika ada query/filter, sonst ke hero
  const q = headerSearch.value.trim();
  if (q.length > 0 || activeFilter) {
    resultsSection.classList.add('active');
    if (activeFilter) filterBar.classList.add('active');
  } else {
    resetToHero();
  }
}

// --- INIT ---
async function init() {
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allVideos = data.videos || [];
    buildPopularTags();
  } catch(e) {
    // Tampilkan error di results area
    dismissHero();
    resultsSection.classList.add('active');
    grid.innerHTML = `<div class="state-msg">Gagal memuat data.json<small>${escHtml(e.message)}<br>Jalankan via server, bukan buka file langsung.</small></div>`;
  }
}
init();
</script>
</body>
</html>
