<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ngecrot.fun</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="mark">ngecrot.fun</div>
    <div class="tagline">Now Screening</div>
  </header>

  <div class="filter-bar" id="filterBar" hidden>
    <span class="filter-label">Kategori:</span>
    <span class="filter-value" id="filterValue"></span>
    <button class="filter-clear" id="filterClear">Hapus filter &times;</button>
  </div>

  <main class="grid" id="grid">
    <!-- diisi otomatis dari data.json -->
  </main>

  <nav class="pagination" id="pagination" aria-label="Navigasi halaman">
    <!-- diisi otomatis -->
  </nav>

  <div class="player-overlay" id="overlay" hidden>
    <div class="player-panel">
      <button class="close-btn" id="closeBtn" aria-label="Tutup player">&times;</button>
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-info">
        <h1 id="playerTitle">—</h1>
        <p class="player-desc" id="playerDesc"></p>
        <div class="player-meta-row">
          <p class="player-cast" id="playerCast"></p>
          <div class="player-tags" id="playerTags"></div>
        </div>
        <a class="download-btn" id="downloadBtn" target="_blank" rel="noopener noreferrer">
          Unduh Video
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
