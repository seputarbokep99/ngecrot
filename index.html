<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix</title>
    <style>
        :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --text: #fff; --sub: #aaa; --accent: #e50914; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        /* HEADER */
        header { padding: 15px 24px; background: rgba(15,15,15,0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; cursor: pointer; }

        /* HOME GRID (16:9 Covers) */
        .home-view { padding: 24px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        
        .card { cursor: pointer; border-radius: 10px; overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: scale(1.03); }
        .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #222; display: block; }
        .card-body { padding: 10px 4px; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 0.75rem; color: var(--sub); display: flex; gap: 8px; align-items: center; }
        .badge { background: var(--border); padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 600; }

        /* WATCH PAGE LAYOUT */
        .watch-view { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; gap: 24px; }
        .watch-view.active { display: grid; grid-template-columns: 1fr 380px; }

        /* Primary: Player + Info */
        .primary { min-width: 0; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .player-box iframe, .player-box video { width: 100%; height: 100%; border: none; }
        .watch-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .watch-meta { color: var(--sub); font-size: 0.85rem; margin-bottom: 16px; line-height: 1.6; }
        .watch-meta span { margin-right: 12px; }

        /* Sidebar: Recommendations */
        .sidebar { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 100px); overflow-y: auto; padding-right: 4px; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .rec-card { display: flex; gap: 10px; cursor: pointer; padding: 6px; border-radius: 8px; transition: background 0.2s; }
        .rec-card:hover { background: var(--surface); }
        .rec-thumb { width: 160px; min-width: 160px; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover; background: #222; }
        .rec-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .rec-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .rec-sub { font-size: 0.7rem; color: var(--sub); }

        .back-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .back-btn:hover { background: var(--surface); border-color: #555; }

        .empty-msg { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--sub); }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .watch-view.active { grid-template-columns: 1fr; }
            .sidebar { max-height: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 10px; }
            .rec-card { flex-direction: column; }
            .rec-thumb { width: 100%; min-width: unset; }
        }
        @media (max-width: 600px) {
            .home-view, .watch-view { padding: 12px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-title { font-size: 0.8rem; }
            header { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">▶ STREAMFLIX</div>
</header>

<!-- HALAMAN BERANDA -->
<div id="homeView" class="home-view">
    <div id="grid" class="grid">
        <div class="empty-msg">Memuat video...</div>
    </div>
</div>

<!-- HALAMAN NONTON (Player + Rekomendasi) -->
<div id="watchView" class="watch-view">
    <div class="primary">
        <button class="back-btn" onclick="goHome()">← Kembali</button>
        <div class="player-box" id="playerBox"></div>
        <h1 class="watch-title" id="wTitle"></h1>
        <div class="watch-meta" id="wMeta"></div>
    </div>
    <div class="sidebar" id="recList"></div>
</div>

<script>
    let allVideos = [];
    const homeView = document.getElementById('homeView');
    const watchView = document.getElementById('watchView');
    const grid = document.getElementById('grid');
    const playerBox = document.getElementById('playerBox');
    const recList = document.getElementById('recList');

    // Deteksi tipe URL
    function isEmbed(url) {
        return /iframe|embed|vk\.ru\/video_ext|youtube\.com\/embed|dailymotion\.com\/embed/i.test(url);
    }

    // Render kartu untuk beranda
    function renderCard(v, idx) {
        return `<div class="card" onclick="openWatch(${idx})">
            <img class="card-thumb" src="${v.cover}" alt="${v.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/640x360/222/666?text=No+Cover'">
            <div class="card-body">
                <div class="card-title">${v.title}</div>
                <div class="card-meta">
                    <span>${v.studio}</span>
                    <span class="badge">${v.kategori?.[0] || 'Umum'}</span>
                </div>
            </div>
        </div>`;
    }

    // Render kartu rekomendasi (compact horizontal)
    function renderRec(v, idx, currentIdx) {
        if (idx === currentIdx) return ''; // Skip video yang sedang diputar
        return `<div class="rec-card" onclick="openWatch(${idx})">
            <img class="rec-thumb" src="${v.cover}" alt="${v.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/222/666?text=No+Cover'">
            <div class="rec-info">
                <div class="rec-title">${v.title}</div>
                <div class="rec-sub">${v.studio} • ${v.kategori?.[0] || ''}</div>
            </div>
        </div>`;
    }

    // Buka halaman nonton
    function openWatch(idx) {
        const v = allVideos[idx];
        if (!v) return;

        // Set player
        playerBox.innerHTML = isEmbed(v.url)
            ? `<iframe src="${v.url}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>`
            : `<video src="${v.url}" controls autoplay playsinline></video>`;

        // Set info
        document.getElementById('wTitle').textContent = v.title;
        document.getElementById('wMeta').innerHTML = `
            <span>🎬 ${v.studio}</span>
            <span>🎭 ${v.pemeran?.join(', ') || '-'}</span>
            <span>🏷️ ${v.kategori?.join(', ') || 'Umum'}</span>
        `;

        // Render rekomendasi (semua video kecuali yang sedang diputar)
        recList.innerHTML = allVideos.map((vid, i) => renderRec(vid, i, idx)).join('') 
            || '<div style="color:var(--sub);padding:20px;text-align:center;">Tidak ada video lain</div>';

        // Switch view
        homeView.style.display = 'none';
        watchView.classList.add('active');
        window.scrollTo(0, 0);
    }

    // Kembali ke beranda
    function goHome() {
        playerBox.innerHTML = ''; // Stop video
        watchView.classList.remove('active');
        homeView.style.display = 'block';
    }

    // Load data
    async function init() {
        try {
            const res = await fetch('data.json');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            allVideos = data.videos || [];

            if (allVideos.length === 0) {
                grid.innerHTML = '<div class="empty-msg">Belum ada video.</div>';
                return;
            }
            grid.innerHTML = allVideos.map((v, i) => renderCard(v, i)).join('');
        } catch (e) {
            grid.innerHTML = `<div class="empty-msg">❌ Gagal memuat data.json<br><small>${e.message}<br>Pastikan dijalankan via server, bukan buka file langsung.</small></div>`;
        }
    }

    init();
</script>
</body>
</html>
