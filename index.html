<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0d;
    --bg-soft: #111114;
    --line: #232326;
    --text: #eeeae1;
    --text-dim: #8a8a90;
    --amber: #f5b942;
    --amber-dim: #7a5c21;
    --teal: #123c3c;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100vh;
  }

  /* subtle film-grain vignette over whole page */
  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    z-index: 5;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  main{
    padding: 24px 20px 60px;
  }

  .grid{
    columns: 5 260px;
    column-gap: 14px;
  }
  @media (max-width: 1100px){ .grid{ columns: 3 220px; } }
  @media (max-width: 640px){ .grid{ columns: 2 150px; column-gap: 8px; } }

  .card{
    break-inside: avoid;
    margin-bottom: 14px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    aspect-ratio: 16 / 9;
    cursor: pointer;
    opacity: 0;
    transform: translateY(14px) scale(.97);
    animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise{ to{ opacity:1; transform: translateY(0) scale(1); } }

  .card:hover{
    border-color: var(--amber-dim);
  }
  .card:hover .frame{
    transform: scale(1.035);
  }
  .card:hover .hover-ring{
    opacity: 1;
  }

  .frame{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
    display:block;
    pointer-events: none;
    transition: transform .5s cubic-bezier(.2,.7,.2,1);
  }

  .hover-ring{
    position:absolute; inset:0;
    border-radius:14px;
    box-shadow: inset 0 0 0 2px var(--amber);
    opacity:0;
    transition: opacity .2s ease;
    pointer-events:none;
  }

  .card .play{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition: opacity .2s ease, background .2s ease;
  }
  .card:hover .play{
    opacity:1;
    background: rgba(0,0,0,0.15);
  }
  .play svg{
    width:38px; height:38px;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6));
  }

  /* Lightbox */
  #lightbox{
    position: fixed; inset:0;
    z-index: 50;
    background: rgba(6,6,8,0.92);
    backdrop-filter: blur(10px);
    display:none;
    align-items:center; justify-content:center;
    padding: 40px 20px;
  }
  #lightbox.open{ display:flex; }
  .lb-inner{
    width: min(920px, 100%);
    aspect-ratio: 16/9;
    border-radius: 16px;
    overflow:hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px var(--line);
    position: relative;
    background:#000;
    transform: scale(.92);
    opacity:0;
    animation: pop .35s cubic-bezier(.2,.8,.2,1.1) forwards;
  }
  @keyframes pop{ to{ transform:scale(1); opacity:1; } }
  .lb-inner iframe, .lb-inner video{
    width:100%; height:100%; border:0; display:block;
  }
  #closeBtn{
    position: absolute; top: -46px; right:0;
    background: none; border:0;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: .04em;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  #closeBtn:hover{ color: var(--amber); }

  .empty, .loading{
    color: var(--text-dim);
    text-align:center;
    padding: 120px 20px;
    font-size: 14px;
    letter-spacing: .02em;
  }
</style>
</head>
<body>

<main>
  <div id="grid" class="grid"></div>
</main>

<div id="lightbox">
  <div class="lb-inner" id="lbInner">
    <button id="closeBtn">✕ TUTUP</button>
  </div>
</div>

<script>
(function(){
  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const lbInner = document.getElementById('lbInner');
  let currentData = [];

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function isDirectVideo(url){
    return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url);
  }

  function makeEmbedEl(url, { autoplay, muted, controls }){
    if(isDirectVideo(url)){
      const v = document.createElement('video');
      v.src = url;
      v.className = 'frame';
      v.muted = !!muted;
      v.loop = true;
      v.playsInline = true;
      v.controls = !!controls;
      if(autoplay){ v.autoplay = true; v.play().catch(()=>{}); }
      return v;
    }
    const f = document.createElement('iframe');
    const sep = url.includes('?') ? '&' : '?';
    let src = url;
    if(autoplay) src += sep + 'autoplay=1&mute=' + (muted ? '1':'0') + '&controls=' + (controls ? '1':'0') + '&loop=1&playsinline=1';
    f.src = src;
    f.className = 'frame';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    return f;
  }

  function openLightbox(url){
    lbInner.querySelectorAll('.frame').forEach(el => el.remove());
    const el = makeEmbedEl(url, { autoplay: true, muted: false, controls: true });
    lbInner.appendChild(el);
    lightbox.classList.add('open');
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lbInner.querySelectorAll('.frame').forEach(el => el.remove());
  }

  document.getElementById('closeBtn').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

  function render(data){
    grid.innerHTML = '';
    if(!data.length){
      grid.innerHTML = '<div class="empty">data.json kosong — tambahkan url video.</div>';
      return;
    }
    data.forEach((url, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (Math.min(i,24) * 25) + 'ms';

      const embed = makeEmbedEl(url, { autoplay: true, muted: true, controls: false });
      card.appendChild(embed);

      const ring = document.createElement('div');
      ring.className = 'hover-ring';
      card.appendChild(ring);

      const play = document.createElement('div');
      play.className = 'play';
      play.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
      card.appendChild(play);

      card.addEventListener('click', () => openLightbox(url));
      grid.appendChild(card);
    });
  }

  grid.innerHTML = '<div class="loading">Memuat video…</div>';

  fetch('data.json')
    .then(res => {
      if(!res.ok) throw new Error('gagal memuat data.json');
      return res.json();
    })
    .then(data => {
      currentData = Array.isArray(data) ? data.map(item => typeof item === 'string' ? item : item.url).filter(Boolean) : [];
      render(shuffle(currentData));
    })
    .catch(err => {
      grid.innerHTML = '<div class="empty">Gagal memuat data.json.<br>Jalankan file ini lewat local server (bukan dibuka langsung dari file explorer),<br>contoh: <code>python3 -m http.server</code>, lalu buka http://localhost:8000</div>';
      console.error(err);
    });
})();
</script>

</body>
</html>
