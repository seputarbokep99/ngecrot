<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO-CR💦T.FUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0d;
    --bg-soft: #121014;
    --line: #262129;
    --text: #f3eef1;
    --text-dim: #9a8f96;
    --amber: #ff3d81;
    --amber-dim: #7a1f45;
    --teal: #3a1030;
    --topbar-h: 56px;
    --sidebar-w: 240px;
    --sidebar-w-mini: 72px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height:100vh;
    display: flex;
    flex-direction: column;
  }
  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  /* Topbar */
  #topbar{
    position: fixed;
    top:0; left:0; right:0;
    height: var(--topbar-h);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-left{
    display:flex; align-items:center; gap:12px;
    flex-shrink: 0;
  }
  #hamburger{
    width: 40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:0;
    color: var(--text);
    cursor:pointer;
    border-radius: 50%;
    transition: background .15s ease;
  }
  #hamburger:hover{ background: var(--bg-soft); }
  #hamburger svg{ width:20px; height:20px; }
  .brand{
    display:flex; align-items:center; gap:8px;
    text-decoration:none;
    color: var(--text);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .brand .dot{
    width:9px; height:9px; border-radius:2px;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber);
    flex-shrink:0;
  }
  .topbar-center{
    flex: 1 1 auto;
    display:flex; justify-content:center;
    min-width: 0;
  }
  #searchForm{
    width: 100%;
    max-width: 600px;
    display:flex;
  }
  #searchInput{
    flex:1;
    height: 38px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 999px 0 0 999px;
    padding: 0 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    min-width: 0;
  }
  #searchInput::placeholder{ color: var(--text-dim); }
  #searchInput:focus{ border-color: var(--amber-dim); }
  #searchBtn{
    width: 56px; flex-shrink:0;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 0 999px 999px 0;
    color: var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #searchBtn:hover{ color: var(--amber); }
  #searchBtn svg{ width:17px; height:17px; }
  .topbar-right{
    flex-shrink: 0;
    display:flex; align-items:center;
  }
  .video-count{
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  @media (max-width: 720px){
    .video-count{ display:none; }
  }
  @media (max-width: 560px){
    .brand span.txt{ display:none; }
  }
  /* Sidebar */
  #sidebar{
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: var(--bg);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    z-index: 35;
    transition: width .2s ease, transform .25s ease;
    padding: 10px 8px 24px;
  }
  body.sidebar-mini #sidebar{ width: var(--sidebar-w-mini); }
  .side-section{
    padding: 10px 4px 6px;
  }
  .side-section + .side-section{
    border-top: 1px solid var(--line);
    margin-top: 6px;
  }
  .side-label{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    padding: 4px 12px 8px;
    text-transform: uppercase;
  }
  body.sidebar-mini .side-label{ display:none; }
  .side-item{
    width:100%;
    display:flex; align-items:center; gap:20px;
    background:none; border:0;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align:left;
    padding: 10px 12px;
    border-radius: 10px;
    cursor:pointer;
    white-space: nowrap;
  }
  .side-item:hover{ background: var(--bg-soft); }
  .side-item.active{
    background: var(--bg-soft);
    color: var(--amber);
    font-weight: 700;
  }
  .side-item svg{ width:19px; height:19px; flex-shrink:0; }
  .side-item .tag-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--amber-dim);
    flex-shrink:0;
  }
  .side-item.active .tag-dot{ background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  body.sidebar-mini .side-item span{ display:none; }
  body.sidebar-mini .side-item{ justify-content:center; padding:12px 0; }
  #contentCol{
    margin-left: var(--sidebar-w);
    padding-top: var(--topbar-h);
    transition: margin-left .2s ease;
    min-height: 100vh;
    flex: 1;
    display:flex;
    flex-direction: column;
  }
  body.sidebar-mini #contentCol{ margin-left: var(--sidebar-w-mini); }
  #sidebarOverlay{
    display:none;
    position: fixed; inset:0;
    top: var(--topbar-h);
    background: rgba(0,0,0,0.5);
    z-index: 34;
  }
  @media (max-width: 900px){
    #sidebar{
      transform: translateX(-100%);
      width: 260px;
    }
    body.sidebar-mobile-open #sidebar{ transform: translateX(0); }
    body.sidebar-mobile-open #sidebarOverlay{ display:block; }
    #contentCol{ margin-left: 0 !important; }
    body.sidebar-mini #sidebar{ width: 260px; }
  }
  /* Chips row */
  #chipsRow{
    position: sticky;
    top: var(--topbar-h);
    z-index: 20;
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 14px 20px;
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  #chipsRow::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink: 0;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip:hover{ border-color: var(--amber-dim); }
  .chip.active{
    background: var(--amber);
    border-color: var(--amber);
    color: #0a0a0d;
  }
  .title{ display:none; }
  header{ display:none; }
  footer{
    text-align: center;
    padding: 24px 20px 32px;
    border-top: 1px solid var(--line);
    margin-top: 20px;
    flex-shrink: 0;
  }
  footer p{
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  main{
    padding: 20px 20px 60px;
    flex: 1 0 auto;
  }
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  }
  .card{
    cursor: pointer;
    opacity: 0;
    transform: translateY(14px) scale(.97);
    animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise{ to{ opacity:1; transform: translateY(0) scale(1); } }
  .thumb{
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    aspect-ratio: 16 / 9;
  }
  .card:hover .thumb{
    border-color: var(--amber-dim);
  }
  /* MODIFIED: Removed gap since avatar is gone, adjusted padding */
  .card-meta{
    padding-top: 10px;
  }
  .card-text{
    min-width: 0;
  }
  .card-title{
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card:hover .card-title{
    color: var(--amber);
  }
  .card-tags{
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card-tags button{
    font-family: inherit;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .card-tags button:hover{
    color: var(--amber);
    border-color: var(--amber-dim);
  }
  .card:hover .hover-ring{
    opacity: 1;
  }
  .cover{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .cover{
    transform: scale(1.035);
  }
  .frame{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
    display:block;
  }
  .hover-ring{
    position:absolute; inset:0;
    border-radius:12px;
    box-shadow: inset 0 0 0 2px var(--amber);
    opacity:0;
    transition: opacity .2s ease;
    pointer-events:none;
  }
  .card:hover .hover-ring{
    opacity: 1;
  }
  .thumb::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:46%;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    pointer-events:none;
  }
  .card .play{
    position:absolute;
    left:10px; bottom:10px;
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(10,10,13,0.55);
    backdrop-filter: blur(2px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
    transition: transform .2s ease, background .2s ease;
    pointer-events: none;
    z-index: 2;
  }
  .card:hover .play{
    background: var(--amber);
    transform: scale(1.08);
  }
  .play svg{
    width:12px; height:12px;
    margin-left: 1px;
    filter: none;
  }
  .card:hover .play svg{
    fill: #0a0a0d;
  }
  /* Watch view */
  .watch-view{
    padding: 24px 20px 60px;
  }
  #backBtn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
    margin-bottom: 18px;
    transition: border-color .15s ease;
  }
  #backBtn:hover{ border-color: var(--amber-dim); color: var(--amber); }
  .watch-layout{
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 980px){
    .watch-layout{ grid-template-columns: 1fr; }
  }
  .watch-player{
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .watch-player iframe, .watch-player video{
    width:100%; height:100%; border:0; display:block;
  }
  .watch-info{
    padding-top: 20px;
  }
  .watch-title{
    margin: 0 0 12px;
    font-size: clamp(19px, 3vw, 24px);
    font-weight: 800;
    color: var(--text);
    line-height: 1.3;
  }
  .watch-tags{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .watch-tags button{
    font-family: inherit;
    font-size: 12px;
    color: var(--amber);
    background: rgba(255,61,129,0.08);
    border: 1px solid var(--amber-dim);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .watch-tags button:hover{
    background: var(--amber);
    color: #0a0a0d;
  }
  .watch-desc{
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .related-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
  }
  .related-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .related-item{
    display: flex;
    gap: 10px;
    cursor: pointer;
    border-radius: 10px;
    padding: 6px;
    transition: background .15s ease;
  }
  .related-item:hover{
    background: var(--bg-soft);
  }
  .related-thumb{
    position: relative;
    width: 148px;
    flex-shrink: 0;
    aspect-ratio: 16/9;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
  }
  .related-thumb img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .related-info{
    min-width: 0;
  }
  .related-title{
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .related-item:hover .related-title{
    color: var(--amber);
  }
  .related-tags{
    margin-top: 5px;
    font-size: 11px;
    color: var(--text-dim);
  }
  @media (max-width: 640px){
    .related-thumb{ width: 120px; }
  }
  .empty, .loading{
    color: var(--text-dim);
    text-align:center;
    padding: 120px 20px;
    font-size: 14px;
    letter-spacing: .02em;
  }
  .pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    padding: 20px 0 40px;
  }
  .pagination button{
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .pagination button:hover:not(:disabled){
    border-color: var(--amber-dim);
    color: var(--text);
  }
  .pagination button.active{
    background: var(--amber);
    border-color: var(--amber);
    color: #0a0a0d;
  }
  .pagination button:disabled{
    opacity: .35;
    cursor: default;
  }
  .pagination .dots{
    color: var(--text-dim);
    padding: 0 4px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div id="topbar">
  <div class="topbar-left">
    <button id="hamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="#" class="brand" id="titleLink"><span class="dot"></span><span class="txt">GO-CR💦T.FUN</span></a>
  </div>
  <div class="topbar-center">
    <form id="searchForm">
      <input type="text" id="searchInput" placeholder="Cari video..." autocomplete="off">
      <button type="submit" id="searchBtn" aria-label="Cari">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
  </div>
  <div class="topbar-right">
    <div class="video-count" id="videoCount">Jumlah video: 0</div>
  </div>
</div>
<div id="sidebarOverlay"></div>
<aside id="sidebar">
  <div class="side-section">
    <button class="side-item active" data-action="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Beranda</span>
    </button>
  </div>
  <div class="side-section">
    <div class="side-label">Jelajahi</div>
    <div id="tagList"></div>
  </div>
</aside>
<div id="contentCol">
  <div id="chipsRow"></div>
  <main id="homeMain">
    <div id="grid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>
  <div id="watchView" class="watch-view" style="display:none">
    <button id="backBtn">‹ Kembali ke beranda</button>
    <div class="watch-layout">
      <div class="watch-main">
        <div class="watch-player" id="watchPlayer"></div>
        <div class="watch-info">
          <h1 class="watch-title" id="watchTitle"></h1>
          <div class="watch-tags" id="watchTags"></div>
          <p class="watch-desc" id="watchDesc"></p>
        </div>
      </div>
      <aside class="watch-related">
        <div class="related-label">Video lainnya</div>
        <div id="relatedList" class="related-list"></div>
      </aside>
    </div>
  </div>
  <footer>
    <p>GO-CR💦T.FUN — Dibuat dengan ☕ dan ❤️ </p>
  </footer>
</div>
<script>
(function(){
  const grid = document.getElementById('grid');
  const paginationEl = document.getElementById('pagination');
  const videoCountEl = document.getElementById('videoCount');
  const homeMain = document.getElementById('homeMain');
  const watchView = document.getElementById('watchView');
  const watchPlayer = document.getElementById('watchPlayer');
  const watchTitle = document.getElementById('watchTitle');
  const watchTags = document.getElementById('watchTags');
  const watchDesc = document.getElementById('watchDesc');
  const relatedList = document.getElementById('relatedList');
  const backBtn = document.getElementById('backBtn');
  const chipsRow = document.getElementById('chipsRow');
  const tagListEl = document.getElementById('tagList');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  const hamburger = document.getElementById('hamburger');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  let allData = [];
  let filteredData = [];
  let currentPage = 1;
  let PER_PAGE = 12;
  let activeTag = null;
  let searchQuery = '';
  const ROWS_PER_PAGE = 4;

  function calcPerPage(){
    const containerWidth = grid.clientWidth || window.innerWidth - 40;
    const isMobile = window.innerWidth <= 640;
    const minCol = isMobile ? 140 : 220;
    const gap = isMobile ? 8 : 14;
    const cols = Math.max(1, Math.floor((containerWidth + gap) / (minCol + gap)));
    return cols * ROWS_PER_PAGE;
  }

  document.getElementById('titleLink').addEventListener('click', (e) => {
    e.preventDefault();
    resetToHome();
    closeMobileSidebar();
  });

  function isMobileViewport(){ return window.innerWidth <= 900; }

  hamburger.addEventListener('click', () => {
    if(isMobileViewport()){
      document.body.classList.toggle('sidebar-mobile-open');
    } else {
      document.body.classList.toggle('sidebar-mini');
    }
  });

  function closeMobileSidebar(){
    document.body.classList.remove('sidebar-mobile-open');
  }

  sidebarOverlay.addEventListener('click', closeMobileSidebar);

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    applySearch();
  });

  let searchDebounce = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(applySearch, 300);
  });

  function applySearch(){
    searchQuery = searchInput.value.trim().toLowerCase();
    applyFilters();
    goToPage(1, { skipScroll: true });
  }

  function resetToHome(){
    if(watchView.style.display === 'block') closeWatch({ skipHistory: true });
    activeTag = null;
    searchQuery = '';
    searchInput.value = '';
    applyFilters();
    updateActiveChipsAndSideItems();
    goToPage(1);
  }

  function setActiveTag(tag){
    if(watchView.style.display === 'block') closeWatch({ skipHistory: true });
    activeTag = (activeTag === tag) ? null : tag;
    applyFilters();
    updateActiveChipsAndSideItems();
    goToPage(1);
    closeMobileSidebar();
  }

  function applyFilters(){
    filteredData = allData.filter(item => {
      const matchesTag = !activeTag || (item.tags && item.tags.includes(activeTag));
      const q = searchQuery;
      const matchesSearch = !q ||
        (item.title || '').toLowerCase().includes(q) ||
        (item.description || '').toLowerCase().includes(q) ||
        (item.tags || []).some(t => t.toLowerCase().includes(q));
      return matchesTag && matchesSearch;
    });
  }

  function getUniqueTags(){
    const set = new Set();
    allData.forEach(item => (item.tags || []).forEach(t => set.add(t)));
    return [...set];
  }

  function buildChipsAndSidebar(){
    const tags = getUniqueTags();
    chipsRow.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'chip';
    allChip.textContent = 'Semua';
    allChip.dataset.tag = '';
    allChip.addEventListener('click', () => setActiveTag(null));
    chipsRow.appendChild(allChip);

    tagListEl.innerHTML = '';
    tags.forEach(tag => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = '#' + tag;
      chip.dataset.tag = tag;
      chip.addEventListener('click', () => setActiveTag(tag));
      chipsRow.appendChild(chip);

      const sideBtn = document.createElement('button');
      sideBtn.className = 'side-item';
      sideBtn.dataset.tag = tag;
      sideBtn.innerHTML = '<span class="tag-dot"></span><span>#' + tag + '</span>';
      sideBtn.addEventListener('click', () => setActiveTag(tag));
      tagListEl.appendChild(sideBtn);
    });
    updateActiveChipsAndSideItems();
  }

  function updateActiveChipsAndSideItems(){
    chipsRow.querySelectorAll('.chip').forEach(el => {
      el.classList.toggle('active', el.dataset.tag === (activeTag || ''));
    });
    tagListEl.querySelectorAll('.side-item').forEach(el => {
      el.classList.toggle('active', el.dataset.tag === activeTag);
    });
    document.querySelectorAll('.side-item[data-action]').forEach(el => {
      el.classList.toggle('active', el.dataset.action === 'home' && !activeTag && !searchQuery);
    });
  }

  document.querySelector('.side-item[data-action="home"]').addEventListener('click', () => {
    resetToHome();
    closeMobileSidebar();
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function isDirectVideo(url){
    return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url);
  }

  function makeEmbedEl(url, { autoplay, muted, controls }){
    if(isDirectVideo(url)){
      const v = document.createElement('video');
      v.src = url;
      v.className = 'frame';
      v.muted = !!muted;
      v.loop = true;
      v.playsInline = true;
      v.controls = !!controls;
      if(autoplay){ v.autoplay = true; v.play().catch(()=>{}); }
      return v;
    }
    const f = document.createElement('iframe');
    const sep = url.includes('?') ? '&' : '?';
    let src = url;
    if(autoplay) src += sep + 'autoplay=1&mute=' + (muted ? '1':'0') + '&controls=' + (controls ? '1':'0') + '&loop=1&playsinline=1';
    f.src = src;
    f.className = 'frame';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    return f;
  }

  function getVideoIdFromUrl(){
    const params = new URLSearchParams(window.location.search);
    return params.get('v');
  }

  function findItemByVideoId(vid){
    return allData.find(item => encodeURIComponent(item.url) === vid);
  }

  function openWatch(item, opts = {}){
    watchPlayer.innerHTML = '';
    const el = makeEmbedEl(item.url, { autoplay: true, muted: false, controls: true });
    watchPlayer.appendChild(el);
    watchTitle.textContent = item.title || 'Tanpa judul';
    watchDesc.textContent = item.description || '';
    watchTags.innerHTML = '';
    (item.tags || []).forEach(t => {
      const btn = document.createElement('button');
      btn.textContent = '#' + t;
      btn.addEventListener('click', () => {
        closeWatch({ skipHistory: true });
        setActiveTag(t);
      });
      watchTags.appendChild(btn);
    });
    buildRelated(item);
    chipsRow.style.display = 'none';
    homeMain.style.display = 'none';
    watchView.style.display = 'block';
    const url = new URL(window.location);
    url.searchParams.set('v', encodeURIComponent(item.url));
    url.searchParams.delete('page');
    if(opts.replace){
      history.replaceState({ view: 'watch' }, '', url);
    } else {
      history.pushState({ view: 'watch' }, '', url);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildRelated(currentItem){
    relatedList.innerHTML = '';
    const currentTags = currentItem.tags || [];
    const others = allData.filter(it => it.url !== currentItem.url);
    const scored = others.map(it => {
      const shared = (it.tags || []).filter(t => currentTags.includes(t)).length;
      return { item: it, score: shared };
    });
    scored.sort((a, b) => b.score - a.score);
    scored.forEach(({ item }) => {
      const row = document.createElement('div');
      row.className = 'related-item';
      const thumb = document.createElement('div');
      thumb.className = 'related-thumb';
      const img = document.createElement('img');
      img.src = item.cover;
      img.loading = 'lazy';
      img.alt = '';
      thumb.appendChild(img);
      row.appendChild(thumb);
      const info = document.createElement('div');
      info.className = 'related-info';
      const title = document.createElement('div');
      title.className = 'related-title';
      title.textContent = item.title || 'Tanpa judul';
      info.appendChild(title);
      if(item.tags && item.tags.length){
        const tagsLine = document.createElement('div');
        tagsLine.className = 'related-tags';
        tagsLine.textContent = item.tags.slice(0, 2).map(t => '#' + t).join(' ');
        info.appendChild(tagsLine);
      }
      row.appendChild(info);
      row.addEventListener('click', () => openWatch(item));
      relatedList.appendChild(row);
    });
  }

  function closeWatch(opts = {}){
    watchView.style.display = 'none';
    chipsRow.style.display = '';
    homeMain.style.display = '';
    watchPlayer.innerHTML = '';
    if(!opts.skipHistory){
      const url = new URL(window.location);
      url.searchParams.delete('v');
      if(currentPage > 1) url.searchParams.set('page', currentPage); else url.searchParams.delete('page');
      history.pushState({ view: 'home' }, '', url);
    }
  }

  backBtn.addEventListener('click', () => closeWatch());

  window.addEventListener('popstate', () => {
    const vid = getVideoIdFromUrl();
    if(vid){
      const item = findItemByVideoId(vid);
      if(item) openWatch(item, { replace: true });
      else closeWatch({ skipHistory: true });
    } else {
      closeWatch({ skipHistory: true });
      const p = getPageFromUrl();
      if(p !== currentPage){ currentPage = p; render(filteredData); renderPagination(filteredData); }
    }
  });

  // ✂️ MODIFIED: Avatar creation removed entirely
  function render(items){
    grid.innerHTML = '';
    if(!items.length){
      const msg = allData.length ? 'Gak ada video yang cocok. Coba kata kunci atau tag lain.' : 'data.json kosong — tambahkan cover & url video.';
      grid.innerHTML = '<div class="empty">' + msg + '</div>';
      return;
    }
    const start = (currentPage - 1) * PER_PAGE;
    const pageItems = items.slice(start, start + PER_PAGE);
    pageItems.forEach((item, i) => {
      const { cover, url, title, tags } = item;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (Math.min(i,24) * 25) + 'ms';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.className = 'cover';
      img.src = cover;
      img.loading = 'lazy';
      img.alt = '';
      thumb.appendChild(img);
      const ring = document.createElement('div');
      ring.className = 'hover-ring';
      thumb.appendChild(ring);
      const play = document.createElement('div');
      play.className = 'play';
      play.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
      thumb.appendChild(play);
      card.appendChild(thumb);

      // Meta section now only contains text (no avatar)
      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const text = document.createElement('div');
      text.className = 'card-text';
      const h3 = document.createElement('h3');
      h3.className = 'card-title';
      h3.textContent = title || 'Tanpa judul';
      text.appendChild(h3);
      if(tags && tags.length){
        const tagsEl = document.createElement('div');
        tagsEl.className = 'card-tags';
        tags.slice(0, 3).forEach(t => {
          const btn = document.createElement('button');
          btn.textContent = '#' + t;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            setActiveTag(t);
          });
          tagsEl.appendChild(btn);
        });
        text.appendChild(tagsEl);
      }
      meta.appendChild(text);
      card.appendChild(meta);
      card.addEventListener('click', () => openWatch(item));
      grid.appendChild(card);
    });
  }

  function renderPagination(items){
    paginationEl.innerHTML = '';
    const totalPages = Math.ceil(items.length / PER_PAGE);
    if(totalPages <= 1) return;
    function makeBtn(label, page, opts = {}){
      const b = document.createElement('button');
      b.textContent = label;
      if(opts.active) b.classList.add('active');
      if(opts.disabled) b.disabled = true;
      b.addEventListener('click', () => goToPage(page));
      return b;
    }
    paginationEl.appendChild(makeBtn('‹', currentPage - 1, { disabled: currentPage === 1 }));
    const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
    let prev = 0;
    [...pages].filter(p => p >= 1 && p <= totalPages).sort((a,b)=>a-b).forEach(p => {
      if(prev && p - prev > 1){
        const dots = document.createElement('span');
        dots.className = 'dots';
        dots.textContent = '···';
        paginationEl.appendChild(dots);
      }
      paginationEl.appendChild(makeBtn(String(p), p, { active: p === currentPage }));
      prev = p;
    });
    paginationEl.appendChild(makeBtn('›', currentPage + 1, { disabled: currentPage === totalPages }));
  }

  function goToPage(page, opts = {}){
    const totalPages = Math.max(1, Math.ceil(filteredData.length / PER_PAGE));
    currentPage = Math.min(Math.max(1, page), totalPages);
    render(filteredData);
    renderPagination(filteredData);
    const url = new URL(window.location);
    if(currentPage > 1) url.searchParams.set('page', currentPage); else url.searchParams.delete('page');
    history.replaceState(null, '', url);
    if(!opts.skipScroll){
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function getPageFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const p = parseInt(params.get('page'), 10);
    return (p && p > 0) ? p : 1;
  }

  grid.innerHTML = '<div class="loading">Memuat video…</div>';
  fetch('data.json')
    .then(res => {
      if(!res.ok) throw new Error('gagal memuat data.json');
      return res.json();
    })
    .then(data => {
      allData = Array.isArray(data) ? data.filter(item => item && item.cover && item.url) : [];
      allData = shuffle(allData);
      filteredData = allData.slice();
      videoCountEl.textContent = 'Jumlah video: ' + allData.length;
      buildChipsAndSidebar();
      PER_PAGE = calcPerPage();
      const vid = getVideoIdFromUrl();
      const watchItem = vid ? findItemByVideoId(vid) : null;
      if(watchItem){
        goToPage(1, { skipScroll: true });
        openWatch(watchItem, { replace: true });
      } else {
        const totalPages = Math.max(1, Math.ceil(filteredData.length / PER_PAGE));
        const startPage = Math.min(getPageFromUrl(), totalPages);
        goToPage(startPage, { skipScroll: true });
      }
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const newPerPage = calcPerPage();
          if(newPerPage !== PER_PAGE){
            PER_PAGE = newPerPage;
            goToPage(1, { skipScroll: true });
          }
          if(!isMobileViewport()){
            document.body.classList.remove('sidebar-mobile-open');
          }
        }, 200);
      });
    })
    .catch(err => {
      grid.innerHTML = '<div class="empty">Gagal memuat data.json.<br>Jalankan file ini lewat local server (bukan dibuka langsung dari file explorer),<br>contoh: <code>python3 -m http.server</code>, lalu buka http://localhost:8000<br><br>Pastikan tiap item punya field "cover" dan "url".</div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
