<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO-CR💦T.FUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #0a0a0d;
    --bg-soft: #121014;
    --line: #262129;
    --text: #f3eef1;
    --text-dim: #9a8f96;
    --amber: #ff3d81;
    --amber-dim: #7a1f45;
    --teal: #3a1030;
    --topbar-h: 56px;
    --sidebar-w: 240px;
    --sidebar-w-mini: 72px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100vh;
    display: flex;
    flex-direction: column;
  }

  /* subtle film-grain vignette over whole page */
  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    z-index: 5;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* Topbar */
  #topbar{
    position: fixed;
    top:0; left:0; right:0;
    height: var(--topbar-h);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-left{
    display:flex; align-items:center; gap:12px;
    flex-shrink: 0;
  }
  #hamburger{
    width: 40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:0;
    color: var(--text);
    cursor:pointer;
    border-radius: 50%;
    transition: background .15s ease;
  }
  #hamburger:hover{ background: var(--bg-soft); }
  #hamburger svg{ width:20px; height:20px; }

  .brand{
    display:flex; align-items:center; gap:8px;
    text-decoration:none;
    color: var(--text);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .brand .dot{
    width:9px; height:9px; border-radius:2px;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber);
    flex-shrink:0;
  }

  .topbar-center{
    flex: 1 1 auto;
    display:flex; justify-content:center;
    min-width: 0;
  }
  #searchForm{
    width: 100%;
    max-width: 600px;
    display:flex;
  }
  #searchInput{
    flex:1;
    height: 38px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 999px 0 0 999px;
    padding: 0 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    min-width: 0;
  }
  #searchInput::placeholder{ color: var(--text-dim); }
  #searchInput:focus{ border-color: var(--amber-dim); }
  #searchBtn{
    width: 56px; flex-shrink:0;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 0 999px 999px 0;
    color: var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #searchBtn:hover{ color: var(--amber); }
  #searchBtn svg{ width:17px; height:17px; }

  .topbar-right{
    flex-shrink: 0;
    display:flex; align-items:center;
  }
  .video-count{
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  @media (max-width: 720px){
    .video-count{ display:none; }
  }
  @media (max-width: 560px){
    .brand span.txt{ display:none; }
  }

  /* Auth */
  #authArea{
    display: flex;
    align-items: center;
  }
  .auth-login-btn{
    background: var(--amber);
    color: #0a0a0d;
    border: 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .auth-login-btn:hover{ opacity: .88; }
  .auth-user{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .auth-avatar{
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--teal);
    color: var(--amber);
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight: 800;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .auth-email{
    font-size: 12px;
    color: var(--text-dim);
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  @media (max-width: 560px){ .auth-email{ display:none; } }
  .auth-logout-btn{
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .auth-logout-btn:hover{ color: var(--amber); border-color: var(--amber-dim); }

  .login-modal{
    display:none;
    position: fixed; inset:0;
    z-index: 60;
    background: rgba(6,6,8,0.85);
    backdrop-filter: blur(8px);
    align-items:center; justify-content:center;
    padding: 20px;
  }
  .login-modal.open{ display:flex; }
  .login-box{
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
  }
  .login-box h3{
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
  }
  .login-box p{
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .login-close{
    position: absolute; top: 12px; right: 12px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: none;
    border: 0;
    color: var(--text-dim);
    cursor: pointer;
  }
  .login-close:hover{ color: var(--text); }
  #loginForm{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #loginEmail, #loginPassword{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  #loginEmail:focus, #loginPassword:focus{ border-color: var(--amber-dim); }
  .password-field{
    position: relative;
  }
  .password-field #loginPassword{
    padding-right: 40px;
  }
  .toggle-password-btn{
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 0;
    color: var(--text-dim);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-password-btn:hover{ color: var(--amber); }
  .toggle-password-btn svg{ width: 17px; height: 17px; }
  #loginForm button{
    background: var(--amber);
    color: #0a0a0d;
    border: 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  #loginForm button:hover{ opacity: .88; }
  #loginForm button:disabled{ opacity: .6; cursor: default; }
  #loginMsg{
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-dim);
    min-height: 16px;
  }
  #loginMsg.success{ color: var(--amber); }
  #loginMsg.error{ color: #ff6b6b; }
  .auth-toggle-text{
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
  }
  .auth-toggle-text button{
    background: none;
    border: 0;
    color: var(--amber);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  /* Admin panel */
  .admin-box{
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
  }
  #adminForm{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #adminForm input{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  #adminForm input:focus{ border-color: var(--amber-dim); }
  .admin-form-actions{
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .admin-form-actions button{
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    border: 0;
  }
  #adminSubmitBtn{ background: var(--amber); color: #0a0a0d; }
  #adminSubmitBtn:disabled{ opacity: .6; cursor: default; }
  #adminCancelEditBtn{ background: none; color: var(--text-dim); border: 1px solid var(--line); }
  #adminMsg{
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  #adminMsg.success{ color: var(--amber); }
  #adminMsg.error{ color: #ff6b6b; }
  .admin-divider{
    border: 0;
    border-top: 1px solid var(--line);
    margin: 20px 0 14px;
  }
  .admin-list-title{
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
  }
  .admin-video-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
  }
  .admin-video-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  .admin-video-thumb{
    width: 64px; flex-shrink: 0;
    aspect-ratio: 16/9;
    border-radius: 6px;
    object-fit: cover;
    background: var(--bg-soft);
  }
  .admin-video-title{
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .admin-video-actions{
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .admin-video-actions button{
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
  }
  .admin-video-actions button:hover{ color: var(--amber); border-color: var(--amber-dim); }
  .admin-video-actions button.danger:hover{ color: #ff6b6b; border-color: #ff6b6b; }

  /* Sidebar */
  #sidebar{
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: var(--bg);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    z-index: 35;
    transition: width .2s ease, transform .25s ease;
    padding: 10px 8px 24px;
  }
  body.sidebar-mini #sidebar{ width: var(--sidebar-w-mini); }

  .side-section{
    padding: 10px 4px 6px;
  }
  .side-section + .side-section{
    border-top: 1px solid var(--line);
    margin-top: 6px;
  }
  .side-label{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    padding: 4px 12px 8px;
    text-transform: uppercase;
  }
  body.sidebar-mini .side-label{ display:none; }

  .side-item{
    width:100%;
    display:flex; align-items:center; gap:20px;
    background:none; border:0;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align:left;
    padding: 10px 12px;
    border-radius: 10px;
    cursor:pointer;
    white-space: nowrap;
  }
  .side-item:hover{ background: var(--bg-soft); }
  .side-item.active{
    background: var(--bg-soft);
    color: var(--amber);
    font-weight: 700;
  }
  .side-item svg{ width:19px; height:19px; flex-shrink:0; }
  .side-item .tag-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--amber-dim);
    flex-shrink:0;
  }
  .side-item.active .tag-dot{ background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  body.sidebar-mini .side-item span{ display:none; }
  body.sidebar-mini .side-item{ justify-content:center; padding:12px 0; }

  /* Content column shifts right of sidebar */
  #contentCol{
    margin-left: var(--sidebar-w);
    padding-top: var(--topbar-h);
    transition: margin-left .2s ease;
    min-height: 100vh;
    flex: 1;
    display:flex;
    flex-direction: column;
  }
  body.sidebar-mini #contentCol{ margin-left: var(--sidebar-w-mini); }

  /* Sidebar overlay on mobile */
  #sidebarOverlay{
    display:none;
    position: fixed; inset:0;
    top: var(--topbar-h);
    background: rgba(0,0,0,0.5);
    z-index: 34;
  }
  @media (max-width: 900px){
    #sidebar{
      transform: translateX(-100%);
      width: 260px;
    }
    body.sidebar-mobile-open #sidebar{ transform: translateX(0); }
    body.sidebar-mobile-open #sidebarOverlay{ display:block; }
    #contentCol{ margin-left: 0 !important; }
    body.sidebar-mini #sidebar{ width: 260px; }
  }

  /* Chips row */
  #chipsRow{
    position: sticky;
    top: var(--topbar-h);
    z-index: 20;
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 14px 20px;
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  #chipsRow::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink: 0;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip:hover{ border-color: var(--amber-dim); }
  .chip.active{
    background: var(--amber);
    border-color: var(--amber);
    color: #0a0a0d;
  }

  .title{ display:none; }
  header{ display:none; }

  footer{
    text-align: center;
    padding: 24px 20px 32px;
    border-top: 1px solid var(--line);
    margin-top: 20px;
    flex-shrink: 0;
  }
  footer p{
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  main{
    padding: 20px 20px 60px;
    flex: 1 0 auto;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: 1fr; gap: 22px; }
    .card-meta{ padding-top: 10px; }
    .card-title{ font-size: 15px; -webkit-line-clamp: 2; }
  }

  .card{
    cursor: pointer;
    opacity: 0;
    transform: translateY(14px) scale(.97);
    animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise{ to{ opacity:1; transform: translateY(0) scale(1); } }

  .thumb{
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    aspect-ratio: 16 / 9;
  }
  .card:hover .thumb{
    border-color: var(--amber-dim);
  }

  .card-meta{
    display: flex;
    gap: 10px;
    padding-top: 10px;
  }
  .card-text{
    min-width: 0;
  }
  .card-title{
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card:hover .card-title{
    color: var(--amber);
  }
  .card:hover .hover-ring{
    opacity: 1;
  }

  .cover{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .cover{
    transform: scale(1.035);
  }

  .frame{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
    display:block;
  }

  .hover-ring{
    position:absolute; inset:0;
    border-radius:12px;
    box-shadow: inset 0 0 0 2px var(--amber);
    opacity:0;
    transition: opacity .2s ease;
    pointer-events:none;
  }
  .card:hover .hover-ring{
    opacity: 1;
  }

  .thumb::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:46%;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    pointer-events:none;
  }

  .card .play{
    position:absolute;
    left:10px; bottom:10px;
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(10,10,13,0.55);
    backdrop-filter: blur(2px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
    transition: transform .2s ease, background .2s ease;
    pointer-events: none;
    z-index: 2;
  }
  .card:hover .play{
    background: var(--amber);
    transform: scale(1.08);
  }
  .play svg{
    width:12px; height:12px;
    margin-left: 1px;
    filter: none;
  }
  .card:hover .play svg{
    fill: #0a0a0d;
  }

  /* Watch view */
  .watch-view{
    padding: 24px 20px 60px;
  }
  #backBtn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor:pointer;
    margin-bottom: 18px;
    transition: border-color .15s ease;
  }
  #backBtn:hover{ border-color: var(--amber-dim); color: var(--amber); }

  .watch-layout{
    max-width: 1240px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 980px){
    .watch-layout{ grid-template-columns: 1fr; }
  }

  .watch-player{
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .watch-player iframe, .watch-player video{
    width:100%; height:100%; border:0; display:block;
  }

  .watch-info{
    padding-top: 20px;
  }
  .watch-title{
    margin: 0 0 12px;
    font-size: clamp(19px, 3vw, 24px);
    font-weight: 800;
    color: var(--text);
    line-height: 1.3;
  }
  .watch-meta{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .watch-meta-row{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .meta-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-right: 2px;
  }
  .pill-btn{
    font-family: inherit;
    font-size: 12px;
    color: var(--amber);
    background: rgba(255,61,129,0.08);
    border: 1px solid var(--amber-dim);
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .pill-btn:hover{
    background: var(--amber);
    color: #0a0a0d;
  }

  /* Comment section */
  .comment-section{
    margin-top: 28px;
  }
  .comment-heading{
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    margin: 0 0 16px;
  }
  #commentForm{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  #commentText{
    width: 100%;
    min-height: 70px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }
  #commentText::placeholder{ color: var(--text-dim); }

<script>
(function(){
  const grid = document.getElementById('grid');
  const paginationEl = document.getElementById('pagination');
  const videoCountEl = document.getElementById('videoCount');
  const homeMain = document.getElementById('homeMain');
  const watchView = document.getElementById('watchView');
  const watchPlayer = document.getElementById('watchPlayer');
  const watchTitle = document.getElementById('watchTitle');
  const watchMeta = document.getElementById('watchMeta');
  const relatedList = document.getElementById('relatedList');
  const commentForm = document.getElementById('commentForm');
  const commentText = document.getElementById('commentText');
  const commentList = document.getElementById('commentList');
  const commentCount = document.getElementById('commentCount');
  let currentWatchItem = null;
  const backBtn = document.getElementById('backBtn');
  const chipsRow = document.getElementById('chipsRow');
  const tagListEl = document.getElementById('tagList');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  const hamburger = document.getElementById('hamburger');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  let allData = [];
  let filteredData = [];
  let currentPage = 1;
  let PER_PAGE = 12;
  let activeFilter = null; // { type: 'tag'|'studio'|'cast', value }
  let searchQuery = '';
  const ROWS_PER_PAGE = 4;

  function calcPerPage(){
    const isMobile = window.innerWidth <= 640;
    if(isMobile){
      return 8;
    }
    const containerWidth = grid.clientWidth || window.innerWidth - 40;
    const cols = Math.max(1, Math.floor((containerWidth + 14) / (220 + 14)));
    return cols * ROWS_PER_PAGE;
  }

  document.getElementById('titleLink').addEventListener('click', (e) => {
    e.preventDefault();
    resetToHome();
    closeMobileSidebar();
  });

  function isMobileViewport(){ return window.innerWidth <= 900; }

  hamburger.addEventListener('click', () => {
    if(isMobileViewport()){
      document.body.classList.toggle('sidebar-mobile-open');
    } else {
      document.body.classList.toggle('sidebar-mini');
    }
  });

  function closeMobileSidebar(){
    document.body.classList.remove('sidebar-mobile-open');
  }
  sidebarOverlay.addEventListener('click', closeMobileSidebar);

  searchForm.addEventListener('submit', (e) => {
    e.preventDefault();
    applySearch();
  });
  let searchDebounce = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(applySearch, 300);
  });
  function applySearch(){
    searchQuery = searchInput.value.trim().toLowerCase();
    applyFilters();
    goToPage(1, { skipScroll: true });
  }

  function resetToHome(){
    if(watchView.style.display === 'block') closeWatch({ skipHistory: true });
    activeFilter = null;
    searchQuery = '';
    searchInput.value = '';
    applyFilters();
    updateActiveChipsAndSideItems();
    goToPage(1);
  }

  function setFilter(type, value){
    if(watchView.style.display === 'block') closeWatch({ skipHistory: true });
    const isSame = activeFilter && activeFilter.type === type && activeFilter.value === value;
    activeFilter = isSame ? null : (value === null ? null : { type, value });
    applyFilters();
    updateActiveChipsAndSideItems();
    goToPage(1);
    closeMobileSidebar();
  }

  function applyFilters(){
    filteredData = allData.filter(item => {
      let matchesFilter = true;
      if(activeFilter){
        if(activeFilter.type === 'tag') matchesFilter = !!(item.tags && item.tags.includes(activeFilter.value));
        else if(activeFilter.type === 'studio') matchesFilter = item.studio === activeFilter.value;
        else if(activeFilter.type === 'cast') matchesFilter = !!(item.cast && item.cast.includes(activeFilter.value));
      }
      const q = searchQuery;
      const matchesSearch = !q ||
        (item.title || '').toLowerCase().includes(q) ||
        (item.studio || '').toLowerCase().includes(q) ||
        (item.cast || []).some(c => c.toLowerCase().includes(q)) ||

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function isDirectVideo(url){

  function makeEmbedEl(url, { autoplay, muted, controls }){
    if(isDirectVideo(url)){
      const v = document.createElement('video');
      v.src = url;
      v.className = 'frame';
      v.muted = !!muted;
      v.loop = true;
      v.playsInline = true;
      v.controls = !!controls;
      if(autoplay){ v.autoplay = true; v.play().catch(()=>{}); }
      return v;
    }
    const f = document.createElement('iframe');
    const sep = url.includes('?') ? '&' : '?';
    let src = url;
    if(autoplay) src += sep + 'autoplay=1&mute=' + (muted ? '1':'0') + '&controls=' + (controls ? '1':'0') + '&loop=1&playsinline=1';
    f.src = src;
    f.className = 'frame';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    return f;
  }

  async function renderComments(item){
    commentList.innerHTML = '<div class="comment-empty">Memuat komentar...</div>';

    const [{ data: allComments, error }, { data: allReactions }] = await Promise.all([
      sb.from('comments').select('*').eq('video_url', item.url).order('created_at', { ascending: true }),
      sb.from('comment_reactions').select('*')
    ]);

    if(error){
      commentList.innerHTML = '<div class="comment-empty">Gagal memuat komentar.</div>';
      console.error(error);
      return;
    }

    const comments = allComments || [];
    const reactions = allReactions || [];
    const profileMap = await fetchProfilesMap(comments.map(c => c.user_id));

    const topLevel = comments.filter(c => !c.parent_id);
    const repliesByParent = {};
    comments.filter(c => c.parent_id).forEach(c => {
      (repliesByParent[c.parent_id] = repliesByParent[c.parent_id] || []).push(c);
    });

    const reactionsByComment = {};
    reactions.forEach(r => {
      (reactionsByComment[r.comment_id] = reactionsByComment[r.comment_id] || []).push(r);
    });

    function engagementScore(c){
      const replyCount = (repliesByParent[c.id] || []).length;
      const reactionCount = (reactionsByComment[c.id] || []).length;
      return replyCount + reactionCount;
    }

    const sortedTopLevel = topLevel.slice().sort((a, b) => {
      const diff = engagementScore(b) - engagementScore(a);
      if(diff !== 0) return diff;
      return new Date(b.created_at) - new Date(a.created_at);
    });

    commentCount.textContent = topLevel.length;
    commentList.innerHTML = '';

    if(!sortedTopLevel.length){
      commentList.innerHTML = '<div class="comment-empty">Belum ada komentar. Jadi yang pertama komentar!</div>';
      return;
    }

    const shown = sortedTopLevel.slice(0, 5);
    shown.forEach(c => {
      commentList.appendChild(buildCommentEl(c, item, profileMap, reactionsByComment, repliesByParent, false));
    });
  }

  function buildCommentEl(c, item, profileMap, reactionsByComment, repliesByParent, isReply){
    const profile = profileMap[c.user_id];
    const displayName = (profile && profile.display_name) || 'Anonim';

    const row = document.createElement('div');
    row.className = 'comment-item';

    row.appendChild(buildAvatarEl(profile, displayName.charAt(0)));

    const body = document.createElement('div');
    body.className = 'comment-body';

    const head = document.createElement('div');
    head.className = 'comment-head';
    const nameEl = document.createElement('span');
    nameEl.className = 'comment-name';
    nameEl.textContent = displayName;
    const timeEl = document.createElement('span');
    timeEl.className = 'comment-time';
    timeEl.textContent = formatCommentTime(c.created_at);
    head.appendChild(nameEl);
    head.appendChild(timeEl);
    if(c.updated_at){
      const editedEl = document.createElement('span');
      editedEl.className = 'comment-edited';
      editedEl.textContent = '(diedit)';
      head.appendChild(editedEl);
    }

    if(currentUser && currentUser.id === c.user_id){
      const menuBtn = document.createElement('button');
      menuBtn.className = 'comment-menu-btn';
      menuBtn.textContent = '⋯';
      const menu = document.createElement('div');
      menu.className = 'comment-menu';
      const editBtn = document.createElement('button');
      editBtn.textContent = 'Edit';
      const delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = 'Hapus';
      menu.appendChild(editBtn);
      menu.appendChild(delBtn);
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.comment-menu.open').forEach(m => { if(m !== menu) m.classList.remove('open'); });
        menu.classList.toggle('open');
      });
      document.addEventListener('click', () => menu.classList.remove('open'));
      editBtn.addEventListener('click', () => {
        menu.classList.remove('open');
        startEditComment(c, textEl, body);
      });
      delBtn.addEventListener('click', async () => {
        menu.classList.remove('open');
        if(!confirm('Hapus komentar ini?')) return;
        const { error } = await sb.from('comments').delete().eq('id', c.id);
        if(error){ alert('Gagal hapus: ' + error.message); return; }
        renderComments(item);
      });
      head.appendChild(menuBtn);
      head.appendChild(menu);
    }

    body.appendChild(head);

    const textEl = document.createElement('p');
    textEl.className = 'comment-text';
    textEl.textContent = c.text;
    body.appendChild(textEl);

    // Reactions bar
    const actions = document.createElement('div');
    actions.className = 'comment-actions';
    const myReactions = (reactionsByComment[c.id] || []);
    const myReaction = currentUser ? myReactions.find(r => r.user_id === currentUser.id) : null;

    REACTIONS.forEach(emoji => {
      const count = myReactions.filter(r => r.emoji === emoji).length;
      const btn = document.createElement('button');
      btn.className = 'reaction-btn' + (myReaction && myReaction.emoji === emoji ? ' active' : '');
      btn.textContent = emoji + (count > 0 ? ' ' + count : '');
      btn.addEventListener('click', async () => {
        if(!currentUser){ openLoginModal('login'); return; }
        if(myReaction && myReaction.emoji === emoji){
          await sb.from('comment_reactions').delete().eq('comment_id', c.id).eq('user_id', currentUser.id);
        } else {
          await sb.from('comment_reactions').upsert({ comment_id: c.id, user_id: currentUser.id, emoji });
        }
        renderComments(item);
      });
      actions.appendChild(btn);
    });

    if(!isReply){
      const replyBtn = document.createElement('button');
      replyBtn.className = 'reply-btn';
      replyBtn.textContent = 'Balas';
      replyBtn.addEventListener('click', () => {
        if(!currentUser){ openLoginModal('login'); return; }
        replyForm.classList.toggle('open');
        if(replyForm.classList.contains('open')) replyForm.querySelector('textarea').focus();
      });
      actions.appendChild(replyBtn);
    }

    body.appendChild(actions);

    // Reply form (only for top-level comments)
    var replyForm;
    if(!isReply){
      replyForm = document.createElement('div');
      replyForm.className = 'reply-form';
      const ta = document.createElement('textarea');
      ta.placeholder = 'Tulis balasan...';
      ta.maxLength = 500;
      replyForm.appendChild(ta);
      const formActions = document.createElement('div');
      formActions.className = 'reply-form-actions';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'reply-cancel';
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Batal';
      cancelBtn.addEventListener('click', () => { replyForm.classList.remove('open'); ta.value=''; });
      const sendBtn = document.createElement('button');
      sendBtn.className = 'reply-send';
      sendBtn.type = 'button';
      sendBtn.textContent = 'Kirim';
      sendBtn.addEventListener('click', async () => {
        const text = ta.value.trim();
        if(!text || !currentUser) return;
        sendBtn.disabled = true;
        const { error } = await sb.from('comments').insert({
          video_url: item.url,
          user_id: currentUser.id,
          name: displayNameFor(currentUser.id, currentUser.email),
          text,
          parent_id: c.id
        });
        sendBtn.disabled = false;
        if(error){ alert('Gagal membalas: ' + error.message); return; }
        renderComments(item);
      });
      formActions.appendChild(cancelBtn);
      formActions.appendChild(sendBtn);
      replyForm.appendChild(formActions);
      body.appendChild(replyForm);

      // Replies list
      const childReplies = (repliesByParent[c.id] || []).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
      if(childReplies.length){
        const list = document.createElement('div');
        list.className = 'replies-list';
        childReplies.forEach(rc => {
          list.appendChild(buildCommentEl(rc, item, profileMap, reactionsByComment, repliesByParent, true));
        });
        body.appendChild(list);
      }
    }

    row.appendChild(body);
    return row;
  }

  function startEditComment(c, textEl, body){
    const form = document.createElement('div');
    form.className = 'comment-edit-form';
    const ta = document.createElement('textarea');
    ta.value = c.text;
    ta.maxLength = 500;
    form.appendChild(ta);
    const actionsRow = document.createElement('div');
    actionsRow.className = 'reply-form-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'reply-cancel';
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'Batal';
    cancelBtn.addEventListener('click', () => {
      form.replaceWith(textEl);
    });
    const saveBtn = document.createElement('button');
    saveBtn.className = 'reply-send';
    saveBtn.type = 'button';
    saveBtn.textContent = 'Simpan';
    saveBtn.addEventListener('click', async () => {
      const newText = ta.value.trim();
      if(!newText) return;
      saveBtn.disabled = true;
      const { error } = await sb.from('comments').update({ text: newText, updated_at: new Date().toISOString() }).eq('id', c.id);
      saveBtn.disabled = false;
      if(error){ alert('Gagal menyimpan: ' + error.message); return; }
      renderComments(currentWatchItem);
    });
    actionsRow.appendChild(cancelBtn);
    actionsRow.appendChild(saveBtn);
    form.appendChild(actionsRow);
    textEl.replaceWith(form);
  }

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(!currentWatchItem || !currentUser) return;
    const text = commentText.value.trim();
    if(!text) return;

    const submitBtn = commentForm.querySelector('button');
    submitBtn.disabled = true;

    const { error } = await sb.from('comments').insert({
      video_url: currentWatchItem.url,
      user_id: currentUser.id,
      name: displayNameFor(currentUser.id, currentUser.email),
      text
    });

    submitBtn.disabled = false;

    if(error){
      alert('Gagal mengirim komentar: ' + error.message);
      return;
    }

    commentText.value = '';
    renderComments(currentWatchItem);
  });

  // ============================================
  // LIKE & VIEWS
  // ============================================
  const likeBtn = document.getElementById('likeBtn');
  const likeCountEl = document.getElementById('likeCount');
  const watchViewsEl = document.getElementById('watchViews');

  async function recordView(item){
    await sb.from('video_views').insert({ video_url: item.url });
  }

  async function refreshViewCount(item){
    const { count } = await sb.from('video_views').select('*', { count: 'exact', head: true }).eq('video_url', item.url);
    watchViewsEl.textContent = (count || 0).toLocaleString('id-ID') + 'x ditonton';
  }

  async function refreshLikeState(item){
    const { count } = await sb.from('video_likes').select('*', { count: 'exact', head: true }).eq('video_url', item.url);
    likeCountEl.textContent = count || 0;

    if(currentUser){
      const { data } = await sb.from('video_likes').select('*').eq('video_url', item.url).eq('user_id', currentUser.id).maybeSingle();
      likeBtn.classList.toggle('liked', !!data);
    } else {
      likeBtn.classList.remove('liked');
    }
  }

  likeBtn.addEventListener('click', async () => {
    if(!currentWatchItem) return;
    if(!currentUser){ openLoginModal('login'); return; }
    likeBtn.disabled = true;
    if(likeBtn.classList.contains('liked')){
      await sb.from('video_likes').delete().eq('video_url', currentWatchItem.url).eq('user_id', currentUser.id);
    } else {
      await sb.from('video_likes').insert({ video_url: currentWatchItem.url, user_id: currentUser.id });
    }
    likeBtn.disabled = false;
    refreshLikeState(currentWatchItem);
  });

  function openWatch(item, opts = {}){
    watchPlayer.innerHTML = '';
    const el = makeEmbedEl(item.url, { autoplay: true, muted: false, controls: true });
    watchPlayer.appendChild(el);

    currentWatchItem = item;
    watchTitle.textContent = item.title || 'Tanpa judul';
    buildWatchMeta(item);
    buildRelated(item);
    renderComments(item);
    recordView(item).then(() => refreshViewCount(item));
    refreshLikeState(item);

    chipsRow.style.display = 'none';
    homeMain.style.display = 'none';
    watchView.style.display = 'block';

    const url = new URL(window.location);
    url.searchParams.set('v', item.url);
    url.searchParams.delete('page');
    if(opts.replace){
      history.replaceState({ view: 'watch' }, '', url);
    } else {
      history.pushState({ view: 'watch' }, '', url);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buildRelated(currentItem){
    relatedList.innerHTML = '';
    const currentTags = currentItem.tags || [];

    const others = allData.filter(it => it.url !== currentItem.url);
    const scored = others.map(it => {
      const shared = (it.tags || []).filter(t => currentTags.includes(t)).length;
      return { item: it, score: shared };
    });
    scored.sort((a, b) => b.score - a.score);

    scored.forEach(({ item }) => {
      const row = document.createElement('div');
      row.className = 'related-item';

      const thumb = document.createElement('div');
      thumb.className = 'related-thumb';
      const img = document.createElement('img');
      img.src = item.cover;
      img.loading = 'lazy';
      img.alt = '';
      thumb.appendChild(img);
      row.appendChild(thumb);

      const info = document.createElement('div');
      info.className = 'related-info';
      const title = document.createElement('div');
      title.className = 'related-title';
      title.textContent = item.title || 'Tanpa judul';
      info.appendChild(title);
      row.appendChild(info);

      row.addEventListener('click', () => openWatch(item));
      relatedList.appendChild(row);
    });
  }

  function closeWatch(opts = {}){
    watchView.style.display = 'none';
    chipsRow.style.display = '';
    homeMain.style.display = '';
    watchPlayer.innerHTML = '';

    if(!opts.skipHistory){
      const url = new URL(window.location);
      url.searchParams.delete('v');
      if(currentPage > 1) url.searchParams.set('page', currentPage); else url.searchParams.delete('page');
      history.pushState({ view: 'home' }, '', url);
    }
  }

  backBtn.addEventListener('click', () => closeWatch());

  window.addEventListener('popstate', () => {
    const vid = getVideoIdFromUrl();
    if(vid){
      const item = findItemByVideoId(vid);
      if(item) openWatch(item, { replace: true });
      else closeWatch({ skipHistory: true });
    } else {
      closeWatch({ skipHistory: true });
      const p = getPageFromUrl();
      if(p !== currentPage){ currentPage = p; render(filteredData); renderPagination(filteredData); }
    }
  });

  function render(items){
    grid.innerHTML = '';
    if(!items.length){
      const msg = allData.length ? 'Gak ada video yang cocok. Coba kata kunci atau tag lain.' : 'data.json kosong — tambahkan cover & url video.';
      grid.innerHTML = '<div class="empty">' + msg + '</div>';
      return;
    }
    const start = (currentPage - 1) * PER_PAGE;
    const pageItems = items.slice(start, start + PER_PAGE);

    pageItems.forEach((item, i) => {
      const { cover, url, title } = item;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (Math.min(i,24) * 25) + 'ms';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';

      const img = document.createElement('img');
      img.className = 'cover';
      img.src = cover;
      img.loading = 'lazy';
      img.alt = '';
      thumb.appendChild(img);

      const ring = document.createElement('div');
      ring.className = 'hover-ring';
      thumb.appendChild(ring);

      const play = document.createElement('div');
      play.className = 'play';
      play.innerHTML = '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
      thumb.appendChild(play);

      card.appendChild(thumb);

      const meta = document.createElement('div');
      meta.className = 'card-meta';

      const text = document.createElement('div');
      text.className = 'card-text';

      const h3 = document.createElement('h3');
      h3.className = 'card-title';
      h3.textContent = title || 'Tanpa judul';
      text.appendChild(h3);

      meta.appendChild(text);
      card.appendChild(meta);

      card.addEventListener('click', () => openWatch(item));
      grid.appendChild(card);
    });
  }

  function renderPagination(items){
    paginationEl.innerHTML = '';
    const totalPages = Math.ceil(items.length / PER_PAGE);
    if(totalPages <= 1) return;

    function makeBtn(label, page, opts = {}){
      const b = document.createElement('button');
      b.textContent = label;
      if(opts.active) b.classList.add('active');
      if(opts.disabled) b.disabled = true;
      b.addEventListener('click', () => goToPage(page));
      return b;
    }

    paginationEl.appendChild(makeBtn('‹', currentPage - 1, { disabled: currentPage === 1 }));

    const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
    let prev = 0;
    [...pages].filter(p => p >= 1 && p <= totalPages).sort((a,b)=>a-b).forEach(p => {
      if(prev && p - prev > 1){
        const dots = document.createElement('span');
        dots.className = 'dots';
        dots.textContent = '···';
        paginationEl.appendChild(dots);
      }
      paginationEl.appendChild(makeBtn(String(p), p, { active: p === currentPage }));
      prev = p;
    });

    paginationEl.appendChild(makeBtn('›', currentPage + 1, { disabled: currentPage === totalPages }));
  }

  function goToPage(page, opts = {}){
    const totalPages = Math.max(1, Math.ceil(filteredData.length / PER_PAGE));
    currentPage = Math.min(Math.max(1, page), totalPages);
    render(filteredData);
    renderPagination(filteredData);
    const url = new URL(window.location);
    if(currentPage > 1) url.searchParams.set('page', currentPage); else url.searchParams.delete('page');
    history.replaceState(null, '', url);
    if(!opts.skipScroll){
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function getPageFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const p = parseInt(params.get('page'), 10);
    return (p && p > 0) ? p : 1;
  }

  grid.innerHTML = '<div class="loading">Memuat video…</div>';

  async function fetchVideosFromDB(){
    const { data, error } = await sb.from('videos').select('*').order('created_at', { ascending: true });
    if(error){
      console.error(error);
      return null;
    }
    return (data || [])
      .map(v => ({
        cover: v.cover,
        url: v.url,
        title: v.title,
        studio: v.studio,
        cast: v.cast_names || [],
        tags: v.tags || []
      }))
      .filter(item => item.cover && item.url);
  }

  async function reloadVideosFromDB(){
    const videos = await fetchVideosFromDB();
    if(videos === null) return;
    allData = shuffle(videos);
    videoCountEl.textContent = 'Jumlah video: ' + allData.length;
    buildChipsAndSidebar();
    applyFilters();
    PER_PAGE = calcPerPage();
    goToPage(1, { skipScroll: true });
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const newPerPage = calcPerPage();
      if(newPerPage !== PER_PAGE){
        PER_PAGE = newPerPage;
        goToPage(1, { skipScroll: true });
      }
      if(!isMobileViewport()){
        document.body.classList.remove('sidebar-mobile-open');
      }
    }, 200);
  });

  (async () => {
    const videos = await fetchVideosFromDB();

    if(videos === null){
      grid.innerHTML = '<div class="empty">Gagal memuat daftar video dari database.<br>Cek koneksi internet atau pengaturan Supabase kamu.</div>';
      return;
    }

    allData = shuffle(videos);
    filteredData = allData.slice();
    videoCountEl.textContent = 'Jumlah video: ' + allData.length;
    buildChipsAndSidebar();
    PER_PAGE = calcPerPage();

    const vid = getVideoIdFromUrl();
    const watchItem = vid ? findItemByVideoId(vid) : null;

    if(watchItem){
      goToPage(1, { skipScroll: true });
      openWatch(watchItem, { replace: true });
    } else {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / PER_PAGE));
      const startPage = Math.min(getPageFromUrl(), totalPages);
      goToPage(startPage, { skipScroll: true });
    }
  })();
})();
</script>

</body>
</html>
