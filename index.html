<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleStream</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent: #e50914;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        /* Header */
        header {
            padding: 20px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; }

        /* Grid Layout */
        .container { padding: 30px 4%; max-width: 1400px; margin: 0 auto; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Video Card */
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        .card-info { padding: 12px; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; }
        .tag { background: #333; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; }

        /* Modal Player */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal.active { display: flex; }

        .player-wrapper {
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .player-wrapper iframe, .player-wrapper video {
            width: 100%; height: 100%; border: none;
        }

        .close-btn {
            margin-top: 15px;
            padding: 10px 30px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .movie-details {
            color: white;
            margin-top: 15px;
            text-align: center;
            max-width: 900px;
        }

        /* Loading & Error */
        .status-msg { text-align: center; padding: 50px; color: var(--text-sub); grid-column: 1 / -1; }
        
        @media (max-width: 600px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-info { padding: 8px; }
            .card-title { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SIMPLE STREAM</div>
    </header>

    <div class="container">
        <div id="grid" class="video-grid">
            <div class="status-msg">Memuat data video...</div>
        </div>
    </div>

    <!-- Modal Player -->
    <div id="modal" class="modal">
        <div class="player-wrapper" id="player-container"></div>
        <div class="movie-details" id="modal-info"></div>
        <button class="close-btn" onclick="closePlayer()">Tutup Player</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const playerContainer = document.getElementById('player-container');
        const modalInfo = document.getElementById('modal-info');

        // Fungsi untuk mendeteksi apakah URL adalah embed iframe atau video langsung
        function isEmbedUrl(url) {
            return url.includes('iframe') || url.includes('embed') || url.includes('vk.ru/video_ext') || url.includes('youtube.com/embed');
        }

        async function loadVideos() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Gagal memuat data.json');
                const data = await response.json();

                grid.innerHTML = '';
                
                if (!data.videos || data.videos.length === 0) {
                    grid.innerHTML = '<div class="status-msg">Tidak ada video tersedia.</div>';
                    return;
                }

                data.videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openPlayer(video);

                    card.innerHTML = `
                        <img src="${video.cover}" alt="${video.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/333/fff?text=No+Cover'">
                        <div class="card-info">
                            <div class="card-title">${video.title}</div>
                            <div class="card-meta">
                                <span>${video.studio}</span>
                                <span class="tag">${video.kategori[0] || 'Umum'}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                grid.innerHTML = `<div class="status-msg">Error: ${err.message}<br><small>Pastikan Anda menjalankan ini via server (bukan klik 2x file html)</small></div>`;
            }
        }

        function openPlayer(video) {
            let playerHTML = '';
            
            if (isEmbedUrl(video.url)) {
                playerHTML = `<iframe src="${video.url}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
            } else {
                playerHTML = `<video src="${video.url}" controls autoplay></video>`;
            }

            playerContainer.innerHTML = playerHTML;
            modalInfo.innerHTML = `<h2>${video.title}</h2><p>Pemeran: ${video.pemeran.join(', ')} | Studio: ${video.studio}</p>`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            modal.classList.remove('active');
            playerContainer.innerHTML = ''; // Hentikan video/audio
            document.body.style.overflow = 'auto';
        }

        // Tutup modal jika klik area gelap
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closePlayer();
        });

        // Load saat halaman dibuka
        loadVideos();
    </script>
</body>
</html>
