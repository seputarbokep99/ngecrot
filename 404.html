<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<!-- Redirect script untuk menangani routing di GitHub Pages -->
<script type="text/javascript">
  var segmentCount = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~').replace(/%/g, '-percent-').replace(/\?/g, '~question~') +
    (l.search ? '&' + l.search.slice(1) : '') +
    l.hash
  );
</script>
<meta http-equiv="refresh" content="0; url=/">
<title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to home page...</p>
</body>
</html>
